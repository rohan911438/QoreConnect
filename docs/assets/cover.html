<!doctype html>
<html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0}
body{width:1600px;height:900px;background:#07090d;color:#e9eef3;font-family:'Segoe UI',Inter,system-ui,sans-serif;overflow:hidden;position:relative}
.bg{position:absolute;inset:0;background:

.g{background:linear-gradient(100deg,#7cf2c4,#a58bff);-webkit-background-clip:text;color:transparent}
p{font-size:38px;color:#8e9cab;line-height:1.3}
p strong{color:#e9eef3;font-weight:600}
.foot{position:absolute;left:110px;bottom:56px;font-size:22px;color:#8e9cab}
.mono{font-family:Consolas,monospace}
